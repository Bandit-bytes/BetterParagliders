modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "betterparagliders"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies.betterparagliders]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.betterparagliders]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.betterparagliders]]
modId = "paraglider"
type = "required"
reason = "Better Paragliders extends Paraglider's stamina implementation."
versionRange = "[21.1.3,21.2)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.betterparagliders]]
modId = "bettercombat"
type = "required"
reason = "Better Paragliders reads Better Combat attack and combo data."
versionRange = "[2.3.1,)"
ordering = "AFTER"
side = "BOTH"

[[mixins]]
config = "betterparagliders.mixins.json"
